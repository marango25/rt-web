<?xml version="1.0" encoding="UTF-8"?>
<!--
Extraído de "Diagrama ALDL NodeMCU (1).html" (2026-09-19). Ajustes respecto al original,
solo de claridad (el circuito no cambia):
  - el cable del condensador que sale del nodo de D2 pasa de negro (tierra) a naranja (señal);
  - la subida de tierra hacia el pin GND se corrió de x=810 a x=832 para que no cruce las placas del condensador;
  - se agregó la etiqueta "4.7 nF" junto al símbolo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="IBM Plex Mono, ui-monospace, monospace">
  <title>Esquema eléctrico: ALDL, divisor 1 kΩ + 2.2 kΩ, condensador 4.7 nF y NodeMCU</title>
      <rect x="0" y="0" width="1200" height="760" fill="#fffdfa"></rect>

      <!-- ALDL connector -->
      <rect x="70" y="140" width="250" height="290" rx="8" fill="#f1ede6" stroke="#1b1917" stroke-width="2"></rect>
      <text x="82" y="122" font-size="15" font-weight="600" fill="#1b1917">PUERTO ALDL (bajo el tablero)</text>
      <text x="82" y="170" font-size="12" fill="#6b6157">conector de 12 pines</text>

      <rect x="92" y="196" width="150" height="46" rx="5" fill="#fffdfa" stroke="#c9c1b4"></rect>
      <text x="106" y="218" font-size="14" font-weight="600" fill="#1b1917">PIN A</text>
      <text x="106" y="234" font-size="11" fill="#6b6157">Tierra / GND</text>
      <circle cx="320" cy="219" r="7" fill="#1b1917"></circle>

      <rect x="92" y="266" width="150" height="46" rx="5" fill="#fffdfa" stroke="#c9c1b4"></rect>
      <text x="106" y="288" font-size="14" font-weight="600" fill="#1b1917">PIN B</text>
      <text x="106" y="304" font-size="11" fill="#6b6157">Diagnóstico</text>
      <circle cx="320" cy="289" r="7" fill="#1b1917"></circle>

      <rect x="92" y="336" width="150" height="46" rx="5" fill="#fffdfa" stroke="#c9c1b4"></rect>
      <text x="106" y="358" font-size="14" font-weight="600" fill="#1b1917">PIN E (o M)</text>
      <text x="106" y="374" font-size="11" fill="#6b6157">Datos serie 5 V</text>
      <circle cx="320" cy="359" r="7" fill="#c2612a"></circle>

      <!-- 10k activation resistor between A and B -->
      <path d="M320 219 H 400" stroke="#1b1917" stroke-width="3" fill="none"></path>
      <path d="M320 289 H 400" stroke="#1b1917" stroke-width="3" fill="none"></path>
      <path d="M400 219 V 232 M400 276 V 289" stroke="#1b1917" stroke-width="3" fill="none"></path>
      <rect x="382" y="232" width="36" height="44" rx="3" fill="#e7dcc6" stroke="#1b1917" stroke-width="2"></rect>
      <text x="484" y="248" font-size="14" font-weight="600" fill="#1b1917">10 kΩ</text>
      <text x="484" y="266" font-size="11" fill="#6b6157">activa el flujo de datos</text>

      <!-- Signal line E -> 1k -->
      <path d="M320 359 H 448" stroke="#c2612a" stroke-width="3" fill="none"></path>
      <path d="M448 359 A 12 12 0 0 1 472 359" stroke="#c2612a" stroke-width="3" fill="none"></path>
      <path d="M472 359 H 520" stroke="#c2612a" stroke-width="3" fill="none"></path>
      <rect x="520" y="341" width="80" height="36" rx="3" fill="#e7dcc6" stroke="#1b1917" stroke-width="2"></rect>
      <text x="524" y="330" font-size="14" font-weight="600" fill="#1b1917">1 kΩ</text>
      <path d="M600 359 H 860" stroke="#c2612a" stroke-width="3" fill="none"></path>
      <circle cx="700" cy="359" r="6" fill="#c2612a"></circle>
      <text x="646" y="338" font-size="11" fill="#6b6157">unión central → D2</text>

      <!-- 2.2k to ground -->
      <path d="M700 359 V 470" stroke="#c2612a" stroke-width="3" fill="none"></path>
      <rect x="682" y="470" width="36" height="80" rx="3" fill="#e7dcc6" stroke="#1b1917" stroke-width="2"></rect>
      <text x="640" y="440" font-size="14" font-weight="600" fill="#1b1917">2.2 kΩ</text>
      <text x="466" y="584" font-size="11" fill="#6b6157">baja la señal de 5 V a ~3.4 V</text>
      <path d="M700 550 V 660" stroke="#1b1917" stroke-width="3" fill="none"></path>
      <path d="M700 400 H 790 V 474" stroke="#c2612a" stroke-width="3" fill="none"></path>
      <circle cx="700" cy="400" r="6" fill="#c2612a"></circle>
      <path d="M766 474 H 814 M766 498 H 814" stroke="#1b1917" stroke-width="4" fill="none"></path>
      <path d="M790 498 V 660" stroke="#1b1917" stroke-width="3" fill="none"></path>
      <circle cx="790" cy="660" r="6" fill="#1b1917"></circle>
      <text x="726" y="492" font-size="14" font-weight="600" fill="#1b1917">4.7 nF</text>
      <text x="466" y="608" font-size="14" font-weight="600" fill="#1b1917">4.7 nF</text>
      <text x="466" y="626" font-size="11" fill="#6b6157">cerámico "472", sin polaridad</text>
      <text x="466" y="642" font-size="11" fill="#6b6157">filtra el ruido del motor</text>


      <!-- Ground bus -->
      <path d="M320 219 H 460 V 660 H 832 V 449 H 860" stroke="#1b1917" stroke-width="3" fill="none"></path>
      <circle cx="700" cy="660" r="6" fill="#1b1917"></circle>
      <text x="360" y="682" font-size="12" fill="#6b6157">tierra común (Pin A + 2.2 kΩ → GND)</text>

      <!-- NodeMCU board -->
      <rect x="860" y="150" width="270" height="380" rx="10" fill="#16302a" stroke="#0d1c18" stroke-width="2"></rect>
      <text x="880" y="122" font-size="15" font-weight="600" fill="#1b1917">NODEMCU ESP8266</text>
      <rect x="912" y="196" width="166" height="96" rx="4" fill="#2b4a42"></rect>
      <text x="932" y="250" font-size="13" fill="#bcd4cc">módulo ESP-12E</text>

      <rect x="852" y="344" width="86" height="30" rx="4" fill="#d8c063" stroke="#1b1917" stroke-width="2"></rect>
      <text x="864" y="365" font-size="14" font-weight="600" fill="#1b1917">D2</text>
      <text x="946" y="365" font-size="12" fill="#bcd4cc">GPIO4 — datos</text>

      <rect x="852" y="434" width="86" height="30" rx="4" fill="#cfc8bd" stroke="#1b1917" stroke-width="2"></rect>
      <text x="864" y="455" font-size="14" font-weight="600" fill="#1b1917">GND</text>
      <text x="946" y="455" font-size="12" fill="#bcd4cc">tierra</text>

      <rect x="960" y="530" width="70" height="26" rx="4" fill="#cfc8bd" stroke="#1b1917" stroke-width="2"></rect>
      <text x="1042" y="548" font-size="12" fill="#6b6157">micro-USB</text>

      <!-- Power -->
      <path d="M995 556 V 620" stroke="#b03a2e" stroke-width="3" fill="none"></path>
      <rect x="880" y="620" width="240" height="72" rx="8" fill="#f7e9e6" stroke="#b03a2e" stroke-width="2"></rect>
      <text x="900" y="650" font-size="14" font-weight="600" fill="#1b1917">Cargador 12 V → 5 V</text>
      <text x="900" y="670" font-size="11" fill="#6b6157">encendedor del coche + cable USB</text>

      <!-- Legend -->
      <g>
        <line x1="82" y1="720" x2="122" y2="720" stroke="#c2612a" stroke-width="3"></line>
        <text x="132" y="725" font-size="12" fill="#5c554c">señal de datos</text>
        <line x1="260" y1="720" x2="300" y2="720" stroke="#1b1917" stroke-width="3"></line>
        <text x="310" y="725" font-size="12" fill="#5c554c">tierra (GND)</text>
        <line x1="440" y1="720" x2="480" y2="720" stroke="#b03a2e" stroke-width="3"></line>
        <text x="490" y="725" font-size="12" fill="#5c554c">alimentación 5 V</text>
      </g>
    </svg>
